name: Contest Docker image

on:
  push:
    tags:
      - 'contest-*'

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: mera-bot:${{ github.ref_name }}
      ARCHIVE: mera-bot-linux-amd64.tar.gz
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and verify the image
        shell: bash
        run: |
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$IMAGE" .
          printf '/help\n/1\n/quit\n' | docker run --rm -i "$IMAGE" python bot.py --demo | tee demo.log
          grep -F 'Инструкции по использованию бота' demo.log
          grep -F 'Класс и приглашения' demo.log
          docker run --rm -v mera-smoke:/app/data "$IMAGE" python -c "from mera import Store; store = Store('/app/data/smoke.sqlite3'); store.close()"
          docker save "$IMAGE" | gzip -n > "$ARCHIVE"
          sha256sum "$ARCHIVE" > SHA256SUMS
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            printf 'Docker-образ «МЕРЫ» для Linux x86-64.\n\n'
            printf 'Коммит `%s`. Тег образа `%s`.\n\n' "$GITHUB_SHA" "$IMAGE"
            printf 'Команды сборки и запуска приведены в README.\n'
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" SHA256SUMS --verify-tag \
            --title "МЕРА · конкурсная версия" --notes-file release-notes.md
